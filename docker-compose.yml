services:
  db:
    image: postgres:16-alpine
    container_name: monitoring-mobil-db
    restart: unless-stopped
    # Run as the host user so ./pgdata stays owned by the project owner (no root-owned files).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: monitoring
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # No published port: only the web container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: monitoring-mobil:latest
    container_name: monitoring-mobil
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://monitoring:${POSTGRES_PASSWORD}@db:5432/monitoring
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "47823:3000"
    volumes:
      # Legacy JSON storage: read once to import into the database; chat messages still live here.
      - ./data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/passenger/vehicles"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
